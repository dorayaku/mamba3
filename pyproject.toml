[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3"
version = "0.1.0"
description = "Mamba-3 SSD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.setuptools.packages.find]
include = ["mamba3*"]
